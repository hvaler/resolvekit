# ResolveKit on Render: two web services from this repo, each with a small persistent disk.
# Blueprint reference: https://render.com/docs/blueprint-spec — see docs/operations/deployment.md.
#
# - resolvekit: the web app and its API on one public origin (apps/server in hosted mode).
# - resolvekit-metermcp: the metered MCP gateway (apps/metermcp in hosted mode): public /mcp for judges' MCP clients
#   and PayPal's approval return pages; its admin routes answer only apps/server over Render's private network.
#
# Secrets are `sync: false`: Render asks for them once, when the Blueprint is first created (not on later syncs).
# Enter the same PayPal sandbox app credentials (the seller's app) in both services. resolvekit also takes a SECOND
# PayPal app (PAYPAL_IDENTITY_*), owned by another sandbox business account: merchants sign in by approving a
# no-charge request of that app (a seller cannot approve a request of its own app). MeterMCP keeps a DEMO_CODE for
# MCP clients, which cannot sign in with a browser.

services:
  - type: web
    name: resolvekit
    runtime: node
    plan: starter # legacy name of 0.5c-512mb; a disk needs a paid plan
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node apps/server/src/main.ts
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: resolvekit-data
      mountPath: /var/data # analysis cache, analyst usage log, daily caps (and bindings.json if not in BINDINGS_JSON)
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: RESOLVEKIT_MODE
        value: hosted
      - key: RESOLVEKIT_DATA_DIR
        value: /var/data
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_IDENTITY_CLIENT_ID # the platform's PayPal app (another sandbox business account): PayPal sign-in
        sync: false
      - key: PAYPAL_IDENTITY_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID # the CUSTOMER.DISPUTE.* webhook registered on the seller's app for <this URL>/api/paypal/webhook/<PAYPAL_WEBHOOK_KEY>
        sync: false
      - key: PAYPAL_WEBHOOK_KEY # secret segment of that URL (32+ URL-safe characters)
        sync: false
      - key: BINDINGS_JSON # {"<web case id>":{"dispute":"<PayPal sandbox dispute id>","capture":"<its capture id>"}}; npm run demo:prepare prints it
        sync: false
      - key: RESOLVEKIT_OPS_TOKEN # the operator's check (npm run demo:check → GET /api/ops/status); 32+ URL-safe characters, the same in your local .env
        sync: false
      - key: RESOLVEKIT_SESSION_SECRET # signs the session and sign-in cookies
        generateValue: true
      - key: METERMCP_URL # private network host:port of MeterMCP (server-to-server only)
        fromService:
          type: web
          name: resolvekit-metermcp
          property: hostport
      - key: METERMCP_ADMIN_TOKEN # the admin token MeterMCP generated
        fromService:
          type: web
          name: resolvekit-metermcp
          envVarKey: METERMCP_ADMIN_TOKEN
      - key: DAILY_LIVE_ANALYSES
        value: 60
      - key: DAILY_RECHECKS
        value: 200
      - key: DAILY_EVIDENCE_SENDS
        value: 20
      # The buying agent (/agent): run limits, and runs started per day (besides 5 per person and MeterMCP's DAILY_BUDGETS).
      - key: AGENT_MAX_ACTIONS
        value: 8
      - key: AGENT_MAX_MS # agent time, not counting the wait for the PayPal approval
        value: 180000
      - key: AGENT_APPROVAL_TIMEOUT_MS
        value: 900000
      - key: AGENT_MAX_MODEL_CALLS
        value: 12
      - key: AGENT_MAX_INPUT_TOKENS # per model call, estimated before sending
        value: 8000
      - key: AGENT_MAX_OUTPUT_TOKENS # per model call, requested
        value: 1024
      - key: AGENT_RUN_TOKEN_BUDGET # in + out per run, every attempt counted
        value: 60000
      - key: DAILY_AGENT_RUNS
        value: 20
      # Two hops in front of *.onrender.com: Cloudflare appends the visitor, then Render's proxy appends Cloudflare.
      # Verified on the deployed service 2026-10-09: X-Forwarded-For had 2 entries [visitor, Cloudflare edge].
      - key: TRUSTED_PROXY_HOPS
        value: 2
      # Also read by apps/server and not set here, so the code's default applies (docs/technical/configuration.md).
      # Uncomment one only to change the hosted behaviour:
      # - key: DAILY_UPLOADS # evidence uploads per UTC day (default 40)
      #   value: 40
      # - key: RESOLVEKIT_PUBLIC_URL # where PayPal returns the buyer after approving an agent run (default RENDER_EXTERNAL_URL)
      #   value: https://resolvekit.example.com
      # - key: RESOLVEKIT_CUSTOM_DOMAINS # extra public hosts, comma list (default none)
      #   value: resolvekit.example.com
      # - key: RESOLVEKIT_BINDINGS # bindings file when BINDINGS_JSON is unset (default <data>/bindings.json)
      #   value: /var/data/bindings.json
      # - key: TRUSTED_PROXY_PEERS # whose X-Forwarded-For is believed: private (default), any or none
      #   value: private
      # - key: ANALYST_PROVIDER # primary model provider of the analyst and the agent: gemini (default) or groq
      #   value: gemini
      # - key: GEMINI_MODEL # default gemini-3.8-flash; AGENT_GEMINI_MODEL the same for the agent
      #   value: gemini-3.8-flash
      # - key: GROQ_MODEL # default openai/gpt-oss-120b; AGENT_GROQ_MODEL the same for the agent
      #   value: openai/gpt-oss-120b
      # - key: GROQ_TPM # Groq tokens per minute the analyst stays under (default 8000)
      #   value: 8000
      # - key: LIVE_ANALYSES_PER_HOUR # per server, besides DAILY_LIVE_ANALYSES (default 6)
      #   value: 6
      # - key: RECHECKS_PER_HOUR # per server, besides DAILY_RECHECKS (default 30)
      #   value: 30
      # - key: ANALYSIS_CACHE_MAX_DAYS # a cached live analysis unused this long is removed (default 30)
      #   value: 30
      # - key: ANALYSIS_CACHE_MAX_MB # the analysis cache's size; least recently used go first (default 100)
      #   value: 100
      # - key: ANALYST_USAGE_MAX_DAYS # analyst-usage.jsonl lines older than this are dropped (default 90)
      #   value: 90
      # - key: ANALYST_USAGE_MAX_MB # analyst-usage.jsonl size (default 10)
      #   value: 10

  - type: web
    name: resolvekit-metermcp
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: node apps/metermcp/src/main.ts
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: metermcp-data
      mountPath: /var/data # the SQLite ledger and the daily budget cap
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: METERMCP_MODE
        value: hosted
      - key: METERMCP_DATA_DIR
        value: /var/data
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DEMO_CODE # given to judges for their MCP clients (x-demo-code header); resolvekit itself uses sign-in
        sync: false
      - key: METERMCP_ADMIN_TOKEN # shared with resolvekit (fromService above)
        generateValue: true
      - key: METERMCP_BUDGET # the largest budget a run may ask for
        value: "5.00"
      - key: METERMCP_MIN_BUDGET # the smallest
        value: "0.50"
      - key: METERMCP_RETURN_ORIGINS # where PayPal may return the buyer after approving a run's budget: resolvekit's public origin(s), e.g. https://resolvekit.onrender.com
        sync: false
      - key: DAILY_BUDGETS
        value: 20
      - key: TRUSTED_PROXY_HOPS # same two hops as resolvekit (Cloudflare, then Render)
        value: 2
      # Also read by apps/metermcp and not set here (the code's default applies). Uncomment one only to change it:
      # - key: METERMCP_PUBLIC_URL # the public URL of PayPal's return/cancel pages (default RENDER_EXTERNAL_URL)
      #   value: https://metermcp.example.com
      # - key: METERMCP_CUSTOM_DOMAINS # extra public hosts, comma list (default none)
      #   value: metermcp.example.com
      # - key: METERMCP_IDLE_MINUTES # an idle session is closed and settled after this (default 15)
      #   value: 15
      # - key: METERMCP_ALLOWED_ORIGINS # browser origins allowed to call it, comma list (default none)
      #   value: https://resolvekit.example.com
      # - key: METERMCP_DB # the ledger file (default <data>/metermcp.sqlite)
      #   value: /var/data/metermcp.sqlite
      # - key: TRUSTED_PROXY_PEERS # whose X-Forwarded-For is believed: private (default), any or none
      #   value: private
      # METERMCP_FAIL_FIRST is a local test switch: never set it on this service.
