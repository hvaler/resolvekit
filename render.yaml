# ResolveKit on Render: two web services from this repo, each with a small persistent disk.
# Blueprint reference: https://render.com/docs/blueprint-spec — see README "Deploy on Render".
#
# - resolvekit: the web app and its API on one public origin (apps/server in hosted mode).
# - resolvekit-metermcp: the metered MCP gateway (apps/metermcp in hosted mode): public /mcp for judges' MCP clients
#   and PayPal's approval return pages; its admin routes answer only apps/server over Render's private network.
#
# Secrets are `sync: false`: Render asks for them once, when the Blueprint is first created (not on later syncs).
# Enter the same PayPal sandbox app credentials (the seller's app) in both services. resolvekit also takes a SECOND
# PayPal app (PAYPAL_IDENTITY_*), owned by another sandbox business account: merchants sign in by approving a
# no-charge request of that app (a seller cannot approve a request of its own app). MeterMCP keeps a DEMO_CODE for
# MCP clients, which cannot sign in with a browser.

services:
  - type: web
    name: resolvekit
    runtime: node
    plan: starter # legacy name of 0.5c-512mb; a disk needs a paid plan
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node apps/server/src/main.ts
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: resolvekit-data
      mountPath: /var/data # analysis cache, analyst usage log, daily caps (and bindings.json if not in BINDINGS_JSON)
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: RESOLVEKIT_MODE
        value: hosted
      - key: RESOLVEKIT_DATA_DIR
        value: /var/data
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_IDENTITY_CLIENT_ID # the platform's PayPal app (another sandbox business account): PayPal sign-in
        sync: false
      - key: PAYPAL_IDENTITY_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID # the CUSTOMER.DISPUTE.* webhook registered on the seller's app for <this URL>/api/paypal/webhook/<PAYPAL_WEBHOOK_KEY>
        sync: false
      - key: PAYPAL_WEBHOOK_KEY # secret segment of that URL (32+ URL-safe characters)
        sync: false
      - key: BINDINGS_JSON # {"<web case id>":{"dispute":"<PayPal sandbox dispute id>","capture":"<its capture id>"}}; npm run demo:prepare prints it
        sync: false
      - key: RESOLVEKIT_OPS_TOKEN # the operator's check (npm run demo:check → GET /api/ops/status); 32+ URL-safe characters, the same in your local .env
        sync: false
      - key: RESOLVEKIT_SESSION_SECRET # signs the session and sign-in cookies
        generateValue: true
      - key: METERMCP_URL # private network host:port of MeterMCP (server-to-server only)
        fromService:
          type: web
          name: resolvekit-metermcp
          property: hostport
      - key: METERMCP_ADMIN_TOKEN # the admin token MeterMCP generated
        fromService:
          type: web
          name: resolvekit-metermcp
          envVarKey: METERMCP_ADMIN_TOKEN
      - key: DAILY_LIVE_ANALYSES
        value: 60
      - key: DAILY_RECHECKS
        value: 200
      - key: DAILY_EVIDENCE_SENDS
        value: 20
      # The buying agent (/agent): run limits, and runs started per day (besides 5 per person and MeterMCP's DAILY_BUDGETS).
      - key: AGENT_MAX_ACTIONS
        value: 8
      - key: AGENT_MAX_MS # agent time, not counting the wait for the PayPal approval
        value: 180000
      - key: AGENT_APPROVAL_TIMEOUT_MS
        value: 900000
      - key: AGENT_MAX_MODEL_CALLS
        value: 12
      - key: AGENT_MAX_INPUT_TOKENS # per model call, estimated before sending
        value: 8000
      - key: AGENT_MAX_OUTPUT_TOKENS # per model call, requested
        value: 1024
      - key: AGENT_RUN_TOKEN_BUDGET # in + out per run, every attempt counted
        value: 60000
      - key: DAILY_AGENT_RUNS
        value: 20
      # Two hops in front of *.onrender.com: Cloudflare appends the visitor, then Render's proxy appends Cloudflare.
      # Verified on the deployed service 2026-10-09: X-Forwarded-For had 2 entries [visitor, Cloudflare edge].
      - key: TRUSTED_PROXY_HOPS
        value: 2

  - type: web
    name: resolvekit-metermcp
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: node apps/metermcp/src/main.ts
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: metermcp-data
      mountPath: /var/data # the SQLite ledger and the daily budget cap
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: METERMCP_MODE
        value: hosted
      - key: METERMCP_DATA_DIR
        value: /var/data
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DEMO_CODE # given to judges for their MCP clients (x-demo-code header); resolvekit itself uses sign-in
        sync: false
      - key: METERMCP_ADMIN_TOKEN # shared with resolvekit (fromService above)
        generateValue: true
      - key: METERMCP_BUDGET # the largest budget a run may ask for
        value: "5.00"
      - key: METERMCP_MIN_BUDGET # the smallest
        value: "0.50"
      - key: METERMCP_RETURN_ORIGINS # where PayPal may return the buyer after approving a run's budget: resolvekit's public origin(s), e.g. https://resolvekit.onrender.com
        sync: false
      - key: METERMCP_FAIL_FIRST # demo test switch: the first deep_report call of each session fails (never charged; the receipt says so)
        value: deep_report
      - key: DAILY_BUDGETS
        value: 20
      - key: TRUSTED_PROXY_HOPS # same two hops as resolvekit (Cloudflare, then Render)
        value: 2
